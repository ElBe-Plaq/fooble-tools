<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <!-- META -->
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="Fooble Gradient Generator"/>
    <meta name="author" content="Fooble"/>
    <meta http-equiv="content-language" content="en"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="revisit-after" content="2 days"/>

    <link href="assets/css/common/fonts.css" rel="stylesheet"/>
    <link href="assets/css/common/reset.css" rel="stylesheet"/>
    <link href="assets/css/gradient.css" rel="stylesheet"/>
    <link href="assets/css/common/utils.css" rel="stylesheet"/>

    <link href="assets/images/gradient/favicon.ico" rel="shortcut icon"/>

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet"/>

    <meta name="keywords" content="Fooble, CSS Gradient, Gradient Generator"/>
    <meta name="description"
          content="A tool for creating and exporting CSS gradients. You can add multiple colours and preview the gradient."/>

    <title>CSS Gradient Generator</title>
</head>
<body>
<div id="mobile-nav-overlay"></div>

<nav>
    <div class="items">
        <a href="qr-code.html"><i class="ri-qr-code-line"></i> QR Code</a>
        <a href="barcode.html"><i class="ri-barcode-line"></i> Barcode</a>
        <a class="selected" href="css-gradient.html"><i class="ri-palette-line"></i> CSS Gradient</a>
        <a href="password.html"><i class="ri-key-2-line"></i> Password</a>
        <a href="timezone.html"><i class="ri-time-line"></i> Timezone</a>
        <a href="roman-numeral.html"><i class="ri-hashtag"></i> Roman</a>
    </div>

    <p class="mobile-text">Fooble Tools</p>
    <button class="mobile-nav-toggle">
        <i class="ri-gallery-view-2"></i>
    </button>
</nav>

<main>
    <div class="card">
        <h1>CSS Gradient Generator</h1>

        <div class="gradient-generator form">
            <div class="input-box">
                <label for="direction">Gradient Direction</label>
                <select id="direction">
                    <option value="to right">Left to Right</option>
                    <option value="to left">Right to Left</option>
                    <option value="to bottom">Top to Bottom</option>
                    <option value="to top">Bottom to Top</option>
                    <option value="to bottom right">Top Left to Bottom Right</option>
                    <option value="to bottom left">Top Right to Bottom Left</option>
                    <option value="to top right">Bottom Left to Top Right</option>
                    <option value="to top left">Bottom Right to Top Left</option>
                </select>
            </div>

            <div class="input-box">
                <div class="top">
                    <label for="color-stops">Color Stops</label>
                    <button
                            class="btn-outline"
                            id="add-color-stop"
                            title="Add Color Stop"
                    >
                        <i class="ri-add-line"></i>
                    </button>
                </div>

                <div class="color-stops" id="color-stops">
                    <!-- Color stops will be dynamically generated by JavaScript -->
                </div>
            </div>

            <div class="input-box">
                <label for="preview">Preview</label>

                <div id="preview"></div>
            </div>

            <div class="input-box">
                <label for="color-format">Color Format</label>
                <select id="color-format">
                    <option value="hex">HEX</option>
                    <option value="rgb">RGB</option>
                    <option value="hsl">HSL</option>
                </select>
            </div>

            <div class="input-box">
                <label for="code">Generated Code</label>
                <input id="code" type="text" readonly/>
            </div>

            <div class="btns">
                <button class="btn" id="random-btn">
                    <i class="ri-shuffle-line"></i> Randomize
                </button>
                <button class="btn" id="copy-btn">
                    <i class="ri-file-copy-line"></i> Copy
                </button>
            </div>
        </div>
    </div>
</main>

<script src="assets/js/gradient.js"></script>
<script src="assets/js/common/tabs.js"></script>
<script src="assets/js/common/nav.js"></script>
</body>
</html>
